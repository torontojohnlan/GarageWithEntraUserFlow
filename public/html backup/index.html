<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LanSOFT - Garage Remote App</title>
  <link rel="stylesheet" href="styles.css">
  <script>
    window.onload = function () {
      const urlParams = new URLSearchParams(window.location.search);
      const error = urlParams.get('error');
      const message = urlParams.get('message');

      if (error && message) {
        const errorBanner = document.getElementById('errorBanner');
        const errorMessage = document.getElementById('errorMessage');

        if (errorBanner && errorMessage) {
          errorMessage.textContent = decodeURIComponent(message);
          errorBanner.classList.add('show');
          window.history.replaceState({}, document.title, '/');
        }
      }
    };
  </script>
</head>

<body>
  <div id="content">
    <div id="errorBanner" class="error-banner">
      <strong>Authentication Error</strong>
      <span id="errorMessage" class="error"></span>
    </div>
    
    <h1>Garage Remote App</h1>
    <p class="text-muted">Powered by LanSOFT</p>
    <button id="login" type="button" class="btn btn-primary">Login / Sign Up</button>
  </div>
  
  <script>
    document.getElementById("login").onclick = function () {
      window.location.href = "/login";
    };
  </script>
</body>

</html>
