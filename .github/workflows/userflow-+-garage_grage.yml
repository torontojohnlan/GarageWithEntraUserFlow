name: Build and deploy Node.js app to Azure Web App - grage

on:
  push:
    branches:
      - UserFlow-+-Garage
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set Node.js version
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      # 3. Install backend dependencies
      - name: Install server dependencies
        working-directory: ./server
        run: npm install --production

      # 4. Install frontend dependencies (if public has package.json)
      - name: Install public dependencies
        working-directory: ./public
        run: npm install --production || echo "No dependencies in public"

      # 5. Optional: build frontend (uncomment if you have build scripts)
      # - name: Build frontend
      #   working-directory: ./public
      #   run: npm run build

      # 6. Copy public folder into server for deployment
      - name: Copy public into server folder
        run: |
          rm -rf ./server/public
          cp -r ./public ./server/public

      # 7. Upload server folder (now containing public) as artifact
      - name: Upload server artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-app
          path: ./server

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      # 1. Download the built server artifact
      - name: Download server artifact
        uses: actions/download-artifact@v4
        with:
          name: server-app

      # 2. Login to Azure
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_83E529F65616402B8F871E71499D9C72 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_343CED7FDE0A410094D82502BD7C20EE }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_D84AC807FD3E4D6587692090A10D8ABF }}
          
      # 3. Deploy to Azure Web App
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'grage'
          slot-name: 'Production'
          package: ./server-app

