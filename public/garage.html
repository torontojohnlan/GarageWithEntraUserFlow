<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>John Garage Remote</title>
  <script type="module" src="webSocketClient.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
<!-- Profile Button in Top Right -->
<button id="profileBtn" class="profile-btn">👤 Profile</button>

<!-- Floating Profile Menu -->
<div id="profileMenu" class="profile-menu">
  <div class="profile-menu-header">
    <h3>👤 User Profile</h3>
    <button id="closeMenu" class="close-btn" type="button">&times;</button>
  </div>
  <div class="profile-menu-content">
    <div class="profile-item">
      <strong>Display Name:</strong>
      <span id="menuDisplayName">Loading...</span>
    </div>
    <div class="profile-item">
      <strong>Device ID:</strong>
      <span id="menuDeviceID">Loading...</span>
    </div>
    <div class="profile-menu-actions">
      <a href="/public/editProfile.html" class="btn btn-primary">Edit Profile</a>
      <button id="logoutBtn" type="button" class="btn btn-secondary">🔒 Logout</button>
    </div>
  </div>
</div>

<!-- Overlay for menu -->
<div id="menuOverlay" class="menu-overlay"></div>

<div id="content">
    <h1>🏠 Garage Door Status</h1>
    <h2>Door is <strong id="onIndicator">checking...</strong></h2>

    <button id="toggle" disabled type="button" class="btn btn-primary">Not Connected</button>

    <div class="text-muted" id="lastUpdate">
        Last update: N/A
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
        integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
        crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"
        integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
        crossorigin="anonymous"></script>

<script>
// Profile menu functionality
const profileBtn = document.getElementById('profileBtn');
const profileMenu = document.getElementById('profileMenu');
const menuOverlay = document.getElementById('menuOverlay');
const closeMenu = document.getElementById('closeMenu');

let profileDataLoaded = false;
let menuIsOpen = false;

// Load user profile data
async function loadProfileData() {
    if (profileDataLoaded) return;
    
    try {
        const res = await fetch('/api/retrieveUserProfile');
        const user = await res.json();
        if (user.error) {
            document.getElementById('menuDisplayName').innerText = 'Error loading';
            document.getElementById('menuDeviceID').innerText = 'Error loading';
            return;
        }
        document.getElementById('menuDisplayName').innerText = user.DisplayName || 'N/A';
        document.getElementById('menuDeviceID').innerText = user.DeviceID || 'N/A';
        profileDataLoaded = true;
    } catch (err) {
        document.getElementById('menuDisplayName').innerText = 'Error loading';
        document.getElementById('menuDeviceID').innerText = 'Error loading';
        console.error(err);
    }
}

// Open menu
function openProfileMenu(e) {
    if (e) {
        e.preventDefault();
        e.stopPropagation();
    }
    
    if (menuIsOpen) return;
    
    menuIsOpen = true;
    profileMenu.classList.add('active');
    menuOverlay.classList.add('active');
    document.body.classList.add('menu-open'); // Lock body scroll
    loadProfileData();
}

// Close menu
function closeProfileMenu(e) {
    if (e) {
        e.preventDefault();
        e.stopPropagation();
    }
    
    if (!menuIsOpen) return;
    
    menuIsOpen = false;
    profileMenu.classList.remove('active');
    menuOverlay.classList.remove('active');
    document.body.classList.remove('menu-open'); // Restore body scroll
}

// Event listeners
profileBtn.addEventListener('click', openProfileMenu);
profileBtn.addEventListener('touchstart', function(e) {
    e.preventDefault();
    openProfileMenu(e);
}, { passive: false });

closeMenu.addEventListener('click', closeProfileMenu);
closeMenu.addEventListener('touchstart', function(e) {
    e.preventDefault();
    closeProfileMenu(e);
}, { passive: false });

menuOverlay.addEventListener('click', closeProfileMenu);

// Close on escape key
document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && menuIsOpen) {
        closeProfileMenu();
    }
});

// Prevent scroll on menu content when at edges (iOS fix)
let touchStartY = 0;
const menuContent = document.querySelector('.profile-menu-content');

menuContent.addEventListener('touchstart', function(e) {
    touchStartY = e.touches[0].clientY;
}, { passive: true });

menuContent.addEventListener('touchmove', function(e) {
    const touchY = e.touches[0].clientY;
    const scrollTop = menuContent.scrollTop;
    const scrollHeight = menuContent.scrollHeight;
    const clientHeight = menuContent.clientHeight;
    
    // At top and scrolling up
    if (scrollTop === 0 && touchY > touchStartY) {
        e.preventDefault();
    }
    // At bottom and scrolling down
    else if (scrollTop + clientHeight >= scrollHeight && touchY < touchStartY) {
        e.preventDefault();
    }
}, { passive: false });

// Logout functionality
document.getElementById('logoutBtn').addEventListener('click', async function(e) {
    e.preventDefault();
    
    try {
        const response = await fetch('/api/logout', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            }
        });
        
        const data = await response.json();
        
        if (data.logoutUrl) {
            window.location.href = data.logoutUrl;
        } else {
            console.error('No logout URL received');
            window.location.href = '/public/logout.html';
        }
    } catch (error) {
        console.error('Logout error:', error);
        window.location.href = '/public/logout.html';
    }
});

// Prevent auto-opening on page load
document.addEventListener('DOMContentLoaded', () => {
    closeProfileMenu(); // Ensure menu is closed initially
});

// Prevent auto-opening on resize
window.addEventListener('resize', () => {
    if (window.innerWidth <= 768 && menuIsOpen) {
        closeProfileMenu(); // Close menu at 768px or below
    }
});
</script>
</body>
</html>
