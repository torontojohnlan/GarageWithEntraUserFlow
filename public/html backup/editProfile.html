<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Change Profile</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        .readonly {
            background-color: #f5f5f5;
            color: #666;
        }
        button {
            padding: 10px 20px;
            margin-right: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .submit-btn {
            background-color: #007cba;
            color: white;
        }
        .submit-btn:hover {
            background-color: #005a87;
        }
        .back-btn {
            background-color: #6c757d;
            color: white;
        }
        .back-btn:hover {
            background-color: #545b62;
        }
        .error {
            color: red;
            margin-top: 10px;
        }
        .success {
            color: green;
            margin-top: 10px;
        }
        .loading {
            display: none;
            color: #007cba;
        }
    </style>
</head>
<body>
    <h1>Change Profile</h1>
    
    <form id="profileForm">
        <div class="form-group">
            <label for="upn">UPN (User Principal Name):</label>
            <input type="text" id="upn" name="upn" class="readonly" readonly>
        </div>
        
        <div class="form-group">
            <label for="displayName">Display Name:</label>
            <input type="text" id="displayName" name="displayName" required>
        </div>
        
        <div class="form-group">
            <label for="deviceID">Device ID:</label>
            <input type="text" id="deviceID" name="deviceID" required>
        </div>
        
        <div>
            <button type="submit" class="submit-btn">Update Profile</button>
            <button type="button" class="back-btn" onclick="goBack()">Back to Profile</button>
        </div>
        
        <div id="loading" class="loading">Updating profile...</div>
        <div id="message"></div>
    </form>

    <script>
        let originalProfile = {};

        window.onload = async function () {
            try {
                // Load current user profile
                const res = await fetch('/api/retrieveUserProfile');
                const user = await res.json();
                
                if (user.error) {
                    document.getElementById('message').innerHTML = `<div class="error">Error: ${user.error}</div>`;
                    return;
                }

                // Store original profile for comparison
                originalProfile = user;

                // Populate form fields
                document.getElementById('upn').value = user.UPN || '';
                document.getElementById('displayName').value = user.DisplayName || '';
                document.getElementById('deviceID').value = user.DeviceID || '';
                
            } catch (err) {
                document.getElementById('message').innerHTML = '<div class="error">Could not load user profile.</div>';
                console.error('Error loading profile:', err);
            }
        };

        document.getElementById('profileForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitBtn = document.querySelector('.submit-btn');
            const loadingDiv = document.getElementById('loading');
            const messageDiv = document.getElementById('message');
            
            // Clear previous messages
            messageDiv.innerHTML = '';
            
            // Show loading state
            submitBtn.disabled = true;
            loadingDiv.style.display = 'block';
            
            // Get form data
            const formData = {
                upn: document.getElementById('upn').value,
                displayName: document.getElementById('displayName').value,
                deviceID: document.getElementById('deviceID').value
            };
            
            // Validate required fields
            if (!formData.displayName.trim() || !formData.deviceID.trim()) {
                messageDiv.innerHTML = '<div class="error">Display Name and Device ID are required.</div>';
                submitBtn.disabled = false;
                loadingDiv.style.display = 'none';
                return;
            }
            
            try {
                const response = await fetch('/api/editProfile', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    messageDiv.innerHTML = '<div class="success">Profile updated successfully!</div>';
                    // Update original profile to reflect changes
                    originalProfile.DisplayName = formData.displayName;
                    originalProfile.DeviceID = formData.deviceID;
                } else {
                    messageDiv.innerHTML = `<div class="error">Error: ${result.error || 'Failed to update profile'}</div>`;
                }
                
            } catch (err) {
                console.error('Error updating profile:', err);
                messageDiv.innerHTML = '<div class="error">Network error occurred while updating profile.</div>';
            } finally {
                submitBtn.disabled = false;
                loadingDiv.style.display = 'none';
            }
        });

        function goBack() {
            window.location.href = '/public/showProfile.html';
        }

        // Warn user about unsaved changes
        window.addEventListener('beforeunload', function(e) {
            const currentDisplayName = document.getElementById('displayName').value;
            const currentDeviceID = document.getElementById('deviceID').value;
            
            if (originalProfile.DisplayName !== currentDisplayName || 
                originalProfile.DeviceID !== currentDeviceID) {
                e.preventDefault();
                e.returnValue = 'You have unsaved changes. Are you sure you want to leave?';
                return e.returnValue;
            }
        });
    </script>
</body>
</html>
