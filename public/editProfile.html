<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="content">
        <h1>✏️ Edit Profile</h1>
        <p class="text-muted">Update your profile information</p>
        
        <form id="profileForm">
            <div class="form-group">
                <label for="upn">UPN (User Principal Name):</label>
                <input type="text" id="upn" name="upn" class="form-control readonly" readonly>
            </div>
            
            <div class="form-group">
                <label for="displayName">Display Name:</label>
                <input type="text" id="displayName" name="displayName" class="form-control" required>
            </div>
            
            <div class="form-group">
                <label for="deviceID">Device ID:</label>
                <input type="text" id="deviceID" name="deviceID" class="form-control" required>
            </div>
            
            <div class="button-group">
                <button type="submit" class="btn btn-primary">Update Profile</button>
                <button type="button" class="btn btn-secondary" onclick="goBack()">Cancel</button>
            </div>
            
            <div id="loading" class="loading">Updating profile...</div>
            <div id="message"></div>
        </form>
    </div>


    <script>
        let originalProfile = {};

        window.onload = async function () {
            try {
                const res = await fetch('/api/retrieveUserProfile');
                const user = await res.json();
                
                if (user.error) {
                    document.getElementById('message').innerHTML = `<div class="error">Error: ${user.error}</div>`;
                    return;
                }

                originalProfile = user;

                document.getElementById('upn').value = user.UPN || '';
                document.getElementById('displayName').value = user.DisplayName || '';
                document.getElementById('deviceID').value = user.DeviceID || '';
                
            } catch (err) {
                document.getElementById('message').innerHTML = '<div class="error">Could not load user profile.</div>';
                console.error('Error loading profile:', err);
            }
        };

        document.getElementById('profileForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitBtn = document.querySelector('button[type="submit"]');
            const loadingDiv = document.getElementById('loading');
            const messageDiv = document.getElementById('message');
            
            messageDiv.innerHTML = '';
            submitBtn.disabled = true;
            loadingDiv.style.display = 'block';
            
            const formData = {
                upn: document.getElementById('upn').value,
                displayName: document.getElementById('displayName').value,
                deviceID: document.getElementById('deviceID').value
            };
            
            if (!formData.displayName.trim() || !formData.deviceID.trim()) {
                messageDiv.innerHTML = '<div class="error">Display Name and Device ID are required.</div>';
                submitBtn.disabled = false;
                loadingDiv.style.display = 'none';
                return;
            }
            
            try {
                const response = await fetch('/api/editProfile', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    messageDiv.innerHTML = '<div class="success">✓ Profile updated successfully!</div>';
                    originalProfile.DisplayName = formData.displayName;
                    originalProfile.DeviceID = formData.deviceID;
                    
                    setTimeout(() => {
                        window.location.href = '/public/garage.html';
                    }, 1500);
                } else {
                    messageDiv.innerHTML = `<div class="error">Error: ${result.error || 'Failed to update profile'}</div>`;
                }
                
            } catch (err) {
                console.error('Error updating profile:', err);
                messageDiv.innerHTML = '<div class="error">Network error occurred while updating profile.</div>';
            } finally {
                submitBtn.disabled = false;
                loadingDiv.style.display = 'none';
            }
        });

        function goBack() {
            window.location.href = '/public/garage.html';
        }

        window.addEventListener('beforeunload', function(e) {
            const currentDisplayName = document.getElementById('displayName').value;
            const currentDeviceID = document.getElementById('deviceID').value;
            
            if (originalProfile.DisplayName !== currentDisplayName || 
                originalProfile.DeviceID !== currentDeviceID) {
                e.preventDefault();
                e.returnValue = 'You have unsaved changes. Are you sure you want to leave?';
                return e.returnValue;
            }
        });
    </script>
</body>
</html>
