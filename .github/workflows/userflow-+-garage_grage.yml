name: Deploy Node.js to Azure Web App

on:
  push:
    branches:
      - UserFlow-+-Garage  # Change to your default branch name
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: grage    # Set this to your Azure Web App name
  AZURE_WEBAPP_PACKAGE_PATH: '.'      # Set this to the path to your web app project
  NODE_VERSION: '20.x'                # Set this to the node version to use

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: server/package-lock.json

    - name: Prepare deployment package
      run: |
        # Copy server files to root
        cp -r server/* .
        # Copy public folder (not into server subfolder)
        cp -r public .
        # Remove the now-empty server directory
        rm -rf server
        # Remove node_modules to let Azure rebuild
        rm -rf node_modules
        # Verify structure
        ls -la
        ls -la public/

    - name: Upload artifact for deployment job
      uses: actions/upload-artifact@v4
      with:
        name: node-app
        path: |
          package.json
          package-lock.json
          server.js
          public/
          **/*.js
          **/*.json

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Download artifact from build job
      uses: actions/download-artifact@v4
      with:
        name: node-app

    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: .
        startup-command: 'node server.js'