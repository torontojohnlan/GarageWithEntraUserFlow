<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>John Garage Remote</title>
  <script type="module" src="webSocketClient.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
<!-- Profile Button in Top Right -->
<button id="profileBtn" class="profile-btn">👤 Profile</button>

<!-- Floating Profile Menu -->
<div id="profileMenu" class="profile-menu">
  <div class="profile-menu-header">
    <h3>👤 User Profile</h3>
    <button id="closeMenu" class="close-btn">&times;</button>
  </div>
  <div class="profile-menu-content">
    <div class="profile-item">
      <strong>Display Name:</strong>
      <span id="menuDisplayName">Loading...</span>
    </div>
    <div class="profile-item">
      <strong>Device ID:</strong>
      <span id="menuDeviceID">Loading...</span>
    </div>
    <div class="profile-menu-actions">
      <a href="/public/editProfile.html" class="btn btn-primary">Edit Profile</a>
      <button id="logoutBtn" class="btn btn-secondary">🔒 Logout</button>
    </div>
  </div>
</div>

<!-- Overlay for menu -->
<div id="menuOverlay" class="menu-overlay"></div>

<div id="content">
    <h1>🏠 Garage Door Status</h1>
    <h2>Door is <strong id="onIndicator">checking...</strong></h2>

    <button id="toggle" disabled type="button" class="btn btn-primary">Not Connected</button>

    <div class="text-muted" id="lastUpdate">
        Last update: N/A
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
        integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
        crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"
        integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
        crossorigin="anonymous"></script>

<script>
  // Profile menu functionality
  const profileBtn = document.getElementById('profileBtn');
  const profileMenu = document.getElementById('profileMenu');
  const menuOverlay = document.getElementById('menuOverlay');
  const closeMenu = document.getElementById('closeMenu');

  // Load user profile data
  async function loadProfileData() {
    try {
      const res = await fetch('/api/retrieveUserProfile');
      const user = await res.json();
      if (user.error) {
        document.getElementById('menuDisplayName').innerText = 'Error loading';
        document.getElementById('menuDeviceID').innerText = 'Error loading';
        return;
      }
      document.getElementById('menuDisplayName').innerText = user.DisplayName || 'N/A';
      document.getElementById('menuDeviceID').innerText = user.DeviceID || 'N/A';
    } catch (err) {
      document.getElementById('menuDisplayName').innerText = 'Error loading';
      document.getElementById('menuDeviceID').innerText = 'Error loading';
      console.error(err);
    }
  }

  // Open menu
  profileBtn.addEventListener('click', function() {
    profileMenu.classList.add('active');
    menuOverlay.classList.add('active');
    loadProfileData();
  });

  // Close menu
  function closeProfileMenu() {
    profileMenu.classList.remove('active');
    menuOverlay.classList.remove('active');
  }

  closeMenu.addEventListener('click', closeProfileMenu);
  menuOverlay.addEventListener('click', closeProfileMenu);

  // Close on escape key
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && profileMenu.classList.contains('active')) {
      closeProfileMenu();
    }
  });

  // Logout functionality
  document.getElementById('logoutBtn').addEventListener('click', async function() {
    try {
      // Call the logout API
      const response = await fetch('/api/logout', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        }
      });
      
      const data = await response.json();
      
      if (data.logoutUrl) {
        // Redirect to Entra logout URL which will then redirect to logout.html
        window.location.href = data.logoutUrl;
      } else {
        console.error('No logout URL received');
        // Fallback to just going to logout page
        window.location.href = '/public/logout.html';
      }
    } catch (error) {
      console.error('Logout error:', error);
      // Fallback to logout page
      window.location.href = '/public/logout.html';
    }
  });
</script>
</body>
</html>
