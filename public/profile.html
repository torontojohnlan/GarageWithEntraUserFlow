<!DOCTYPE html>
<html>
<head>
  <title>Profile</title>
</head>
<body>
  <h2>Welcome!</h2>
  <div id="profile"></div>
  <script>
    fetch('/api/profile')
      .then(res => res.json())
      .then(data => {
        if (data.error) {
          document.getElementById('profile').innerText = 'Not logged in.';
        } else {
            const profileDiv = document.getElementById('profile');
            profileDiv.innerHTML = '<ul>' +
            Object.entries(data).map(([key, value]) =>
              `<li>${key}: ${value}</li>`
            ).join('') +
            '</ul>';
        }
      });
  </script>
</body>
</html>
